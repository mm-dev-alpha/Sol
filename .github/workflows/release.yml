name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-release:
    name: Build & Publish Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run Unit Tests
        run: dotnet test src/Sol.Tests/Sol.Tests.csproj -c Release --verbosity normal

      - name: Publish Self-Contained Binary
        run: |
          dotnet publish src/Sol/Sol.csproj -c Release -r win-x64 --self-contained -o ./publish

      - name: Package Release ZIP & Generate Checksums
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zipName = "Sol-$tag-win-x64.zip"
          Compress-Archive -Path ./publish/* -DestinationPath $zipName
          $hash = (Get-FileHash $zipName -Algorithm SHA256).Hash
          "$hash  $zipName" | Out-File -FilePath checksums.sha256 -Encoding ascii
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV
          echo "SHA256_HASH=$hash" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ZIP_NAME }}
            checksums.sha256
          body_path: RELEASE_NOTES_v3.6.0.md
          generate_release_notes: false
